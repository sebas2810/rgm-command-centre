name: Deploy RGM Command Centre

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-only
          - frontend-only
          - infra-only

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: rgm-command-centre
  ECS_CLUSTER: RgmCluster
  ECS_SERVICE: RgmApi-ApiService
  S3_BUCKET_OUTPUT_KEY: RgmFrontend:SiteBucketName
  CF_DIST_OUTPUT_KEY: RgmFrontend:DistributionId

permissions:
  id-token: write
  contents: read

jobs:
  # ─── BUILD & TEST ────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build API
        run: npm run build --workspace=packages/api

      - name: Build frontend
        run: npm run build --workspace=packages/frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist/
          retention-days: 1

  # ─── DEPLOY INFRASTRUCTURE (CDK) ────────────────────────────
  deploy-infra:
    name: Deploy Infrastructure
    needs: build-test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.deploy_target == 'all' ||
       github.event.inputs.deploy_target == 'infra-only' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    outputs:
      ecr-repo-uri: ${{ steps.cdk-outputs.outputs.ecr-repo-uri }}
      s3-bucket: ${{ steps.cdk-outputs.outputs.s3-bucket }}
      cf-distribution-id: ${{ steps.cdk-outputs.outputs.cf-distribution-id }}
      alb-dns: ${{ steps.cdk-outputs.outputs.alb-dns }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        run: cd infra && npm ci

      - name: CDK Deploy
        run: |
          cd infra
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Extract CDK outputs
        id: cdk-outputs
        run: |
          echo "ecr-repo-uri=$(jq -r '.RgmApi.EcrRepoUri // empty' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "s3-bucket=$(jq -r '.RgmFrontend.SiteBucketName // empty' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "cf-distribution-id=$(jq -r '.RgmFrontend.DistributionId // empty' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "alb-dns=$(jq -r '.RgmApi.AlbDnsName // empty' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"

  # ─── DEPLOY API (Docker → ECR → ECS) ────────────────────────
  deploy-api:
    name: Deploy API
    needs: [build-test, deploy-infra]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.deploy_target != 'frontend-only' &&
       github.event.inputs.deploy_target != 'infra-only')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f packages/api/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS (force new deployment)
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for ECS service stable
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION
        timeout-minutes: 10

  # ─── DEPLOY FRONTEND (S3 + CloudFront) ──────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [build-test, deploy-infra]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.deploy_target != 'api-only' &&
       github.event.inputs.deploy_target != 'infra-only')
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Get S3 bucket and CF distribution
        id: infra
        run: |
          S3_BUCKET=$(aws cloudformation describe-stacks --stack-name RgmFrontend --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text 2>/dev/null || echo "")
          CF_DIST=$(aws cloudformation describe-stacks --stack-name RgmFrontend --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text 2>/dev/null || echo "")
          echo "s3-bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"
          echo "cf-dist=$CF_DIST" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.infra.outputs.s3-bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          aws s3 cp dist/index.html s3://${{ steps.infra.outputs.s3-bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.infra.outputs.cf-dist }} \
            --paths "/*"

  # ─── RUN DATABASE MIGRATION ──────────────────────────────────
  migrate-db:
    name: Run DB Migration
    needs: [deploy-infra, deploy-api]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.deploy_target == 'all' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get DB connection from Secrets Manager
        id: db
        run: |
          DB_SECRET=$(aws secretsmanager get-secret-value --secret-id RgmDatabase/dbSecret --query SecretString --output text)
          DB_HOST=$(echo $DB_SECRET | jq -r '.host')
          DB_PORT=$(echo $DB_SECRET | jq -r '.port')
          DB_USER=$(echo $DB_SECRET | jq -r '.username')
          DB_PASS=$(echo $DB_SECRET | jq -r '.password')
          DB_NAME=$(echo $DB_SECRET | jq -r '.dbname // "rgm_command_centre"')
          echo "::add-mask::$DB_PASS"
          echo "DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --workspace=packages/shared --workspace=packages/api

      - name: Run Prisma migrate deploy
        run: npx prisma migrate deploy --schema=packages/api/prisma/schema.prisma

      - name: Run seed (first deploy only)
        run: npx prisma db seed --schema=packages/api/prisma/schema.prisma
        continue-on-error: true  # Seed may fail on re-runs (unique constraints)
